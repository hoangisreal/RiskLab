# Monitoring thresholds (MASTER_PLAN Phase 4). Calibrated from control batches so the
# false-alarm rate at the chosen PSI thresholds stays at or below false_alarm_target.
psi_warn: 0.1
psi_alert: 0.25
ks_alert: 0.2
missing_rate_alert: 0.2
false_alarm_target: 0.05
min_n: 200
min_positives: 20
batch_size: 2000
seed: 20261101

# Immutable reference profiles: predictive feature distributions fit on Train;
# output-score distribution describes Selection scores only.
reference_bins: 10
reference_cdf_points: 256
subgroup_bootstrap_resamples: 500
subgroup_ci_level: 0.95
age_band_edges: [0, 25, 35, 45, 55, 65, 150]
performance_bootstrap_resamples: 500
performance_ci_level: 0.99
performance_auc_drop: 0.03
performance_log_loss_increase: 0.03
performance_brier_increase: 0.01
performance_min_auc: 0.65
performance_max_log_loss: 0.50
# Fixed calibration/held-out control design, declared before contract-1.1 simulations.
calibration_control_batches: 100
validation_control_batches: 100
calibration_control_seed: 20261201
validation_control_seed: 20270101
fault_income_multiplier: 1000.0
fault_ext3_missing_fraction: 0.60
fault_label_flip_fraction: 0.10
covariate_strength: 1.0
mild_covariate_strength: 0.25
alert_scale_candidates: [1.0, 1.25, 1.5, 2.0]
