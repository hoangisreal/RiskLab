# E5: post-lock challenger study on the served feature set.
# Declared BEFORE the first run (docs/DECISIONS.md D21). Changing a value after
# results exist requires a note in docs/DECISIONS.md.
#
# This study is descriptive: it compares challengers against the frozen
# LightGBM champion on Selection and never changes the served artifact. It
# lives outside configs/ on purpose: every file under configs/ is hashed into
# the selection lock, and adding this study there would invalidate the frozen
# serving bundle. A challenger win is a proposal for a new selection cycle,
# not a promotion.
experiment_name: risklab-e5-challengers
seed: 20261101

# Champion settings reproduced from the E1-served inner-CV outcome so the
# champion is refitted under the identical protocol (Train fit, Selection
# score) as every challenger.
champion:
  lgbm_n_estimators: 283
  lr_c: 0.01

# Fixed challenger hyperparameters, declared here before running. No
# challenger is tuned on Selection; there is no inner-CV search in E5.
xgboost:
  n_estimators: 600
  learning_rate: 0.03
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
catboost:
  iterations: 800
  learning_rate: 0.03
  depth: 6
hist_gradient_boosting:
  max_iter: 500
  learning_rate: 0.03
  max_leaf_nodes: 31
  min_samples_leaf: 20
  l2_regularization: 1.0

# Comparison rule, evaluated on Selection with a paired bootstrap against the
# champion: a challenger is flagged as superior only if its ROC-AUC gain is at
# least min_gain AND the lower bound of its interval is above 0. Flagging does
# not promote anything; it only justifies proposing a new selection cycle.
decision:
  primary_metric: roc_auc
  min_gain: 0.005
  bootstrap_resamples: 1000
  bootstrap_seed: 20261101
  ci_level: 0.95
