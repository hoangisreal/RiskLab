[project]
name = "risklab"
version = "0.1.0"
description = "Credit risk prediction and model monitoring demo on Home Credit Default Risk"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "lightgbm>=4",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.0",
    "pandas>=3.1.0",
    "pyarrow>=17.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "typer>=0.12",
]

[project.scripts]
risklab = "risklab.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risklab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Dense per-column generator rules read better on one line each.
"src/risklab/synthetic.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "pandas.*", "sklearn.*", "lightgbm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not data'"
markers = [
    "unit: fast tests with no external services",
    "integration: multi-component tests on synthetic data",
    "data: requires the real Home Credit data (skipped in CI)",
    "slow: long-running tests",
]
