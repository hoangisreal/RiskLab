name: risklab-application-local
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: risklab_migrator
      POSTGRES_DB: risklab
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - application_db:/var/lib/postgresql/data
      - ./postgres-roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
    secrets: [owner_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risklab_migrator -d risklab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  application_db:
secrets:
  owner_password: {file: ../.secrets/local_owner_password}
