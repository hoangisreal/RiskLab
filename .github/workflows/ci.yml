name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12.14"
          version: "0.12.21"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m "not data"
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MLFLOW_DISABLE_AGENT_HINT: "1"

  business-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12.14"
          version: "0.12.21"
      - run: uv sync --locked
      # Business fixtures provision disposable postgres:15-alpine via Docker
      # and run real Alembic migrations; SQLite is never substituted.
      - run: uv run pytest tests/business tests/unit/test_business_foundation.py
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MLFLOW_DISABLE_AGENT_HINT: "1"

  frontend:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - working-directory: apps/web
        run: npm ci --ignore-scripts
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run format:check
      - working-directory: apps/web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12.14"
          version: "0.12.21"
      - run: uv sync --locked
      - working-directory: apps/web
        run: npm ci --ignore-scripts
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npm run test:e2e
      - working-directory: apps/web
        run: npm run test:e2e:workflow
