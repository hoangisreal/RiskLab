services:
  mlflow:
    build: {context: ., target: train}
    entrypoint: ["uv", "run", "--no-sync", "mlflow"]
    command: ["server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--artifacts-destination", "/mlflow/artifacts", "--allowed-hosts", "mlflow:5000,localhost:*,127.0.0.1:*"]
    volumes: ["./mlflow-data:/mlflow"]
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
  api:
    build: {context: ., target: api}
    environment: {MLFLOW_TRACKING_URI: "http://mlflow:5000", RISKLAB_ADMIN_API_KEY: "${RISKLAB_ADMIN_API_KEY:-}", WEB_CONCURRENCY: "${RISKLAB_API_WORKERS:-1}"}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {mlflow: {condition: service_healthy}}
    volumes: ["./data:/app/data:ro", "./reports:/app/reports"]
    tmpfs: ["/app/data/duckdb_tmp:uid=1000,gid=1000"]
  train:
    profiles: ["jobs"]
    build: {context: ., target: train}
    working_dir: /workspace
    volumes: [".:/workspace:ro", "./reports:/workspace/reports", "./features:/workspace/features", "./data/monitoring:/workspace/data/monitoring", "./data/duckdb_tmp:/workspace/data/duckdb_tmp"]
    environment: {MLFLOW_TRACKING_URI: "http://mlflow:5000", PYTHONPATH: "/workspace/src", GIT_OPTIONAL_LOCKS: "0", OPENBLAS_NUM_THREADS: "1", OMP_NUM_THREADS: "1", MLFLOW_DISABLE_AGENT_HINT: "1"}
